name: Install CutLoopz Release

on:
  push:
    branches:
      - cutloopz-production-test
    paths:
      - .github/workflows/install-cutloopz-release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cutloopz-release-install
  cancel-in-progress: false

jobs:
  install:
    if: github.ref == 'refs/heads/cutloopz-production-test'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout CutLoopz
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Extract final website release
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile
          import stat

          archive = Path("CUTLOOPZ_FINAL_POLISH_NOV14_2026.zip")
          prefix = "Music-Video-Studio-cutloopz-production-test/"
          if not archive.is_file():
              raise SystemExit("CutLoopz final polish ZIP not found")

          with ZipFile(archive) as z:
              files = [entry for entry in z.infolist() if not entry.is_dir()]
              names = {entry.filename for entry in files}
              for required in ("server.js", "package.json", "public/index.html"):
                  if prefix + required not in names:
                      raise SystemExit("Missing release file: " + required)
              if len(names) != len(files):
                  raise SystemExit("Duplicate ZIP entries detected")
              if sum(entry.file_size for entry in files) > 100_000_000:
                  raise SystemExit("Release is too large")

              for entry in files:
                  name = entry.filename
                  if not name.startswith(prefix) or "\\" in name:
                      raise SystemExit("Unexpected release path")
                  rel = PurePosixPath(name[len(prefix):])
                  if not rel.parts or rel.is_absolute() or ".." in rel.parts:
                      raise SystemExit("Unsafe ZIP path")
                  if stat.S_IFMT(entry.external_attr >> 16) == stat.S_IFLNK:
                      raise SystemExit("Symlink not permitted")
                  if rel.parts[0] in (".git", ".github", "tmp"):
                      continue
                  if rel.name.startswith(".env"):
                      raise SystemExit("Secret config file in ZIP")
                  target = Path(*rel.parts)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(z.read(entry))

          archive.unlink()
          print("CutLoopz final polish release installed")
          PY

      - name: Validate Node server syntax
        run: node --check server.js

      - name: Commit installed website
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Install CutLoopz final polish [skip ci]"
            git push origin HEAD:cutloopz-production-test
          fi
