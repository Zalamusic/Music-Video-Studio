# SELF-CONTAINED CutLoopz source patch for mobile GitHub upload.
# This workflow embeds the verified patch to avoid broken ZIP downloads.
# No paid services, no GPU startup, no tunnel, no paid generation.
# Trigger: commit this single file into .github/workflows on cutloopz-production-test.
# CutLoopz Media — safe source-only installer for the production-test branch.
# The installer never starts a GPU, opens a tunnel, calls a paid provider,
# changes Render environment variables, or enables video generation.
name: CutLoopz Secure GPU Bridge - FFmpeg Verified Installer

on:
  push:
    branches: [cutloopz-production-test]
    paths:
      - '.github/workflows/cutloopz-secure-gpu-bridge-ffmpeg-fixed.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cutloopz-secure-gpu-bridge-ffmpeg-fixed-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-and-install:
    if: github.ref == 'refs/heads/cutloopz-production-test'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      CI: 'true'
      NODE_ENV: test
      ENABLE_PAID_GENERATION: 'false'
      CUTLOOPZ_FULL_PRODUCTION_ENABLED: 'false'
      CUTLOOPZ_UNIFIED_30S_ENABLED: 'false'
      CUTLOOPZ_LOCAL_GENERATION_ENABLED: 'false'
      CUTLOOPZ_LOCAL_AUTORUN_ENABLED: 'false'
      CUTLOOPZ_LOCAL_AUTO_RUN_ENABLED: 'false'
      ZALA_GPU_GENERATION_ENABLED: 'false'
      CUTLOOPZ_MODEL_ENABLED: 'false'
      CUTLOOPZ_S2V_INFERENCE_ENABLED: 'false'

    steps:
      - name: Check out the test branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify and if needed install offline media tools (FFmpeg and FFprobe)
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1 || ! ffmpeg -hide_banner -encoders 2>/dev/null | grep -F 'libx264' >/dev/null; then
            echo 'FFmpeg, FFprobe, or libx264 missing. Installing media dependency on the GitHub test runner.'
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends ffmpeg
          fi
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -hide_banner -version | head -n 1
          ffprobe -hide_banner -version | head -n 1
          ffmpeg -hide_banner -encoders 2>/dev/null | grep -F 'libx264' >/dev/null
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i 'color=c=black:s=64x64:r=1:d=1' -frames:v 1 -c:v libx264 -pix_fmt yuv420p -f null -
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i 'sine=frequency=440:duration=1' -f mp3 "$RUNNER_TEMP/cutloopz-media-smoke.mp3"
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$RUNNER_TEMP/cutloopz-media-smoke.mp3"
          echo 'FFmpeg and FFprobe are verified for the real-media tests; no GPU is involved.'

