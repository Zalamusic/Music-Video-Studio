# CutLoopz: checks the code ACTUALLY ON GitHub, not an offline ZIP.
# This workflow NEVER deploys, starts GPU pods, runs generation, or accesses S3.
name: CutLoopz Production-Test Branch Audit (Safe)

on:
  push:
    branches:
      - cutloopz-production-test
    paths:
      - .github/workflows/cutloopz-branch-audit.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cutloopz-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-current-branch:
    if: github.ref == 'refs/heads/cutloopz-production-test'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: 'true'
      NODE_ENV: test
      ENABLE_PAID_GENERATION: 'false'
      CUTLOOPZ_FULL_PRODUCTION_ENABLED: 'false'
      CUTLOOPZ_LOCAL_GENERATION_ENABLED: 'false'
      CUTLOOPZ_REMOTE_WORKER_ENABLED: 'false'
      CUTLOOPZ_CONTINUOUS_30S_SITE_ENABLED: 'false'
      CUTLOOPZ_LOCAL_AUTORUN_ENABLED: 'false'
      ZALA_GPU_GENERATION_ENABLED: 'false'
      CUTLOOPZ_S2V_INFERENCE_ENABLED: 'false'
    steps:
      - name: Check out the current production-test branch, read only
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Report precise branch commit and source readiness
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os, subprocess
          sha=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          files={
            'server.js':Path('server.js').is_file(),
            'package.json':Path('package.json').is_file(),
            'production router':Path('cutloopz-production-router.mjs').is_file(),
            'HTTPS bridge adapter':Path('cutloopz-local-generator-adapter.mjs').is_file(),
            'continuous 30s test':Path('test-continuous-30s-owner-bridge.mjs').is_file(),
            'V5D website test':Path('test-v5d-spotify-back-scroll.mjs').is_file(),
          }
          text=Path('cutloopz-production-router.mjs').read_text() if files['production router'] else ''
          files['owner-only continuous 30s route']="'/local/continuous-30/jobs'" in text
          summary=['# CutLoopz GitHub source baseline','',f'**Checked commit:** `{sha}`','',
                   '| Source check | Present? |','|---|---|']
          for label,present in files.items():
            summary.append(f'| {label} | {"YES" if present else "NO"} |')
          summary.extend(['', '**Safety:** This audit does not upload code, deploy Render, start RunPod, or enable generation.',
           '**Note:** Test results are NOT proof of a working GPU or real 30-second video.'])
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:f.write('\n'.join(summary)+'\n')
          print('\n'.join(summary))
          if not all(files[k] for k in ('server.js','package.json','production router')):
            raise SystemExit('Required current-branch source is missing; no deployment made')
          PY

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install declared dependencies without lifecycle scripts
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Check JavaScript syntax without running generation
        shell: bash
        run: |
          set -euo pipefail
          find . -maxdepth 1 -type f \( -name '*.mjs' -o -name '*.js' \) -print0 | xargs -0 -r -n1 node --check
          if [ -d public ]; then
            find public -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check
          fi

      - name: Install and verify FFmpeg for real-media assembly tests
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ffmpeg
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -hide_banner -version | head -n 1
          ffprobe -hide_banner -version | head -n 1
          if ! ffmpeg -hide_banner -encoders 2>/dev/null | grep -q 'libx264'; then
            echo 'Required libx264 encoder is missing' >&2
            exit 1
          fi

      - name: Test the actual checked-out branch (no network GPU calls)
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' tests < <(find . -maxdepth 1 -type f \( -name 'test-*.mjs' -o -name 'test-*.js' \) -print0)
          if [ "${#tests[@]}" -eq 0 ]; then
            echo 'No tests found' >&2
            exit 1
          fi
          set +e
          node --test "${tests[@]}" 2>&1 | tee cutloopz-audit-test-results.log
          test_status=${PIPESTATUS[0]}
          set -e
          python3 - <<'PYRESULTS'
          from pathlib import Path
          import os, re
          log=Path('cutloopz-audit-test-results.log').read_text(errors='replace')
          failures=re.findall(r'^not ok \d+ - .+$',log,flags=re.M)
          summary=['## CutLoopz current-branch test failures','',
                   f'**Failing test entries: {len(failures)}**','']
          if failures:
            summary.extend(' - '+line for line in failures)
          else:
            summary.append('No failing test names reported.')
          summary.extend(['','Full TAP output is stored as the **cutloopz-audit-test-log** Actions artifact.',
                          'This run does not deploy, start GPU pods or enable generation.'])
          if os.environ.get('GITHUB_STEP_SUMMARY'):
            with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('\n'.join(summary)+'\n')
          print('\n'.join(summary))
          PYRESULTS
          exit "$test_status"

      - name: Attach complete audit test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cutloopz-audit-test-log
          path: cutloopz-audit-test-results.log
          if-no-files-found: ignore
          retention-days: 7
