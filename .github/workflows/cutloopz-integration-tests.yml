
name: CutLoopz Unified Integration Tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration-tests:
    name: Verify Unified Production Engine
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout CutLoopz source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install FFmpeg and FFprobe
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version
          ffprobe -version
      - name: Install application dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --ignore-scripts --no-audit --no-fund
          else
            npm install --ignore-scripts --no-audit --no-fund
          fi

      - name: Check JavaScript syntax
        run: |
          node --check cutloopz-duration-contract.js
          node --check cutloopz-generation-timeline.js
          node --check cutloopz-shot-ledger.js
          node --check cutloopz-production-director.js
          node --check cutloopz-cinema-engine.js
          node --check cutloopz-unified-production.js
          node --check test-cutloopz-integration.js
          node --check test-cutloopz-unified-production.js

      - name: Run foundation integration tests
        run: node --test test-cutloopz-integration.js

      - name: Run unified production behavioral tests
        env:
          CUTLOOPZ_UNIFIED_30S_ENABLED: 'false'
          CUTLOOPZ_UNIFIED_30S_SPEND_APPROVED: 'false'
          ZALA_GPU_GENERATION_ENABLED: 'false'
          ENABLE_PAID_GENERATION: 'false'
        run: node --test test-cutloopz-unified-production.js

      
      - name: Run real FFmpeg video assembly test
        env:
          ENABLE_PAID_GENERATION: 'false'
          CUTLOOPZ_PERFORMANCE_PILOT_ENABLED: 'false'
        run: node --test test-assembler-real-ffmpeg.mjs

      - name: Confirm verification completed
        run: |
          echo "CutLoopz integration verification complete."
          echo "Paid video generation was not authorized."
