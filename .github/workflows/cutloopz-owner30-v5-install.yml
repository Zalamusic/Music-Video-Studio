# Single-file, self-contained GitHub Actions installer for the private CutLoopz V5 owner pilot.
# No RunPod action, no spending, no secret values, no customer generation.
name: CutLoopz V5 30-Second Owner Bridge - Safe Installer

on:
  push:
    branches:
      - cutloopz-production-test
    paths:
      - '.github/workflows/cutloopz-owner30-v5-install.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cutloopz-owner30-v5-${{ github.ref }}
  cancel-in-progress: false

jobs:
  install:
    if: github.ref == 'refs/heads/cutloopz-production-test'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: 'true'
      NODE_ENV: test
      CUTLOOPZ_OWNER_30_ENABLED: 'false'
      ENABLE_PAID_GENERATION: 'false'
      CUTLOOPZ_FULL_PRODUCTION_ENABLED: 'false'
      ZALA_GPU_GENERATION_ENABLED: 'false'
    steps:
      - name: Checkout production-test branch
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify and install owner-only source (no API requests)
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/owner30.b64" <<'SOURCE_B64'
