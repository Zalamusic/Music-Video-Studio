          mount="// Owner-only V5 RunPod bridge. Disabled for generation until explicit environment approval.\napp.use('/api/cutloopz-owner30', createOwner30Router({express,multer,authorize:isVideoAdmin}));\n\n"
          anchor="app.get('/api/gpu/status', (req, res) => {"
          section=payload['owner30-admin-section.html'].decode('utf-8')
          script=payload['owner30-admin-script.html'].decode('utf-8')
          if new_import not in s:
              if s.count(old_import)!=1 or s.count(anchor)!=1 or 'createOwner30Router' in s:
                  raise SystemExit('Server source changed. Owner-only patch refused; inspect current branch')
              s=s.replace(old_import,old_import+'\n'+new_import).replace(anchor,mount+anchor)
          if 'id="owner30Pilot"' not in h:
              if h.count('<section id="fullProduction"')!=1 or h.count('</body>')!=1 or 'cutloopz-owner30' in h:
                  raise SystemExit('Admin page changed. Owner-only patch refused; inspect current branch')
              h=h.replace('<section id="fullProduction"',section+'<section id="fullProduction"').replace('</body>',script+'</body>')
          for name in ('cutloopz-owner30-bridge.mjs','test-cutloopz-owner30-v5.mjs'):
              dest=Path(name)
              if dest.exists() and dest.read_bytes()!=payload[name]:
                  raise SystemExit(name+' already changed; refusing overwrite')
          # All source preconditions are checked before writing any file.
          server.write_text(s); html.write_text(h)
          for name in ('cutloopz-owner30-bridge.mjs','test-cutloopz-owner30-v5.mjs'):
              Path(name).write_bytes(payload[name])
          print('Owner-only V5 HTTPS bridge staged. All generation switches remain disabled.')
          PY_APPLY

      - name: Verify source and run no-cost tests
        shell: bash
        run: |
          set -euo pipefail
          node --check server.js
          node --check cutloopz-owner30-bridge.mjs
          node --check test-cutloopz-owner30-v5.mjs
          node --test test-*.mjs | tee "$RUNNER_TEMP/cutloopz-owner30-tests.tap"
          grep -Fx '# fail 0' "$RUNNER_TEMP/cutloopz-owner30-tests.tap"
      - name: Commit owner-only bridge to test branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'CutLoopz Release Automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- server.js public/admin-unified-production.html cutloopz-owner30-bridge.mjs test-cutloopz-owner30-v5.mjs
          if git diff --cached --quiet; then
            echo 'Matching owner-only bridge already deployed; no changes required.'
          else
            git commit -m 'Install authenticated owner-only V5 continuous 30-second GPU bridge (disabled)'
            git push origin HEAD:cutloopz-production-test
          fi
