              raise SystemExit('Embedded source checksum mismatch; branch unchanged')
          with ZipFile(io.BytesIO(data)) as z:
              files = z.infolist()
              expected_names = {'cutloopz-owner30-bridge.mjs', 'test-cutloopz-owner30-v5.mjs', 'owner30-admin-section.html', 'owner30-admin-script.html'}
