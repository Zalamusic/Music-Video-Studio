name: Install CutLoopz Phase 18
'on':
  push:
    branches:
    - cutloopz-production-test
    paths:
    - CutLoopz-phase18-runtime-readiness.zip
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Verify archive and install guarded changes
      run: |
        python3 - <<'PYINSTALL'
        MANIFEST = '{"PHASE9-TESTS.txt": {"old": null, "new": "cd9fe10e3c97e7978405bb0a0133ae262843b07da855936a2cb675611f4cbab1"}, "cutloopz-job-control.js": {"old": null, "new": "2c5079b8ed8be636943282782bfe666d77b7aaf39e5b8fa79260e7ee02264f42"}, "test-cutloopz-runtime-readiness.js": {"old": null, "new": "0dc2005d5f667d9f683854fcf95043f2684064fa231b8ac8a5f2494beb938665"}, "PHASE11-TESTS.txt": {"old": null, "new": "ce6fda38d0b495874da6113e048e4093a443723e6bd5be7e86b34e965bcdaf3e"}, "PHASE10-NOTES.txt": {"old": null, "new": "85f5124215c5486879d67265962fcc88448020f0251cc48cdd4229dea827efc1"}, "test-cutloopz-offline-integration.js": {"old": null, "new": "0226d4678acf480837eba3123acdc82034b7c51165700925fe1cfd149d3f85e8"}, "cinematic-editing-engine.js": {"old": "204a9c85fb8576d2f80a76c63366260c2f29fee369bf1d251198997383ec4a61", "new": "1ccc7c9f10c5392ed3402b0f697a2957036a726c25bbb66a1bcb31375defc874"}, "PHASE8-NOTES.txt": {"old": null, "new": "907a28b493e7c0d90d3eb50d507374f7697bcebe66cda183cf33655aec15d9cd"}, "cutloopz-60s-route.js": {"old": null, "new": "8c876b17f01e2cca66eacd531abadba906eda217dd0ba4db91b4c453f5814c3f"}, "PHASE12-NOTES.txt": {"old": null, "new": "f64cf004732249196a7691c0a295d62b8ab31ed8eb2d10105026861fff1f77c8"}, "PHASE18-NOTES.txt": {"old": null, "new": "23d53158f3a465d5a2b4eea9e70de9f153d83c174bc8666c38c6d80861f80a39"}, "PHASE11-NOTES.txt": {"old": null, "new": "bbde0e1ce876a18d7a7264ce20119f7d3ac911837d6ad62e6359a7e2f5876f09"}, "test-cutloopz-provider-execution.js": {"old": null, "new": "4c34eed120ea6b82f0cec142a4b322a1ac78e7934306eb76802647eb34b2314d"}, "test-cutloopz-provider-readiness.js": {"old": null, "new": "47cef45d1374c6100d1da6d2c075496d8bb7f0a29d9fa9b08cc0de690d11bffd"}, "OFFLINE-INTEGRATION-NOTES.txt": {"old": null, "new": "90043d552bb92bdf8d41b10a77fe0a9b68a560f8c102edf94ac1d5bcc19add47"}, "PHASE10-TESTS.txt": {"old": null, "new": "13602817b601c3d13e61f4ba6e7fe5583c4d5b7f1c5d147d2871a1a23497bd54"}, "PHASE17-NOTES.txt": {"old": null, "new