ESTS.txt": {"old": null, "new": "45622e88b90b380100134ea18cc6d079f8901359c0193a5f3a71e1eff55f72e5"}, "cutloopz-render-routing.js": {"old": null, "new": "f42100443ef27eb3ad8557122a9af387aef97b7acb4d5e720db6aef41c2c0b2c"}, "PHASE7-NOTES.txt": {"old": null, "new": "e71a8e15ef83c11206022d81d4b89236aa0f989378ca7c69961144fc2a71fdb2"}, "PHASE9-NOTES.txt": {"old": null, "new": "a56a5c65c45e7b37c16d9de814bbfbb7472061f419eae68ba39a052b6291ec8d"}, "cutloopz-performance-preparation.js": {"old": null, "new": "3bc27dbd3cac4982c67c41fbbfc662df19a1749470980b99f414609ac316077c"}, "test-cutloopz-performance-preparation.js": {"old": null, "new": "b95523ebd1c07fbf18ea359ee7f93c5663e9a80b26411f37a33af46ec78c22e5"}, "public/admin-unified-production.html": {"old": "f253910ed17eb7897c4b2d54758aef5aba007c42df4f50ad5b0967368a4d64a2", "new": "46f47837051e73d863cc2eb0eee274e199bba6be96115e32293a659ee8dd871f"}, "cutloopz-provider-execution.js": {"old": null, "new": "87cb8609a9cb0dc14a4385a8df05a659328e6ea3ce6902a3522c56c54d467786"}, "test-cutloopz-strict-edit.js": {"old": null, "new": "e7260a458b2313a1f7549f9be7d01718d7754fb226f1dc2e0d01ad2b6c7b4336"}}'
        import pathlib, zipfile, hashlib, json
        p=pathlib.Path('.')
        manifest=json.loads(MANIFEST)
        h=lambda b:hashlib.sha256(b).hexdigest()
        with zipfile.ZipFile('CutLoopz-phase18-runtime-readiness.zip') as z:
            assert z.testzip() is None
            for name, hashes in manifest.items():
                target=p/name
                assert not target.is_symlink() and not any(x.is_symlink() for x in target.parents), name
                assert h(z.read(name)) == hashes['new'], name
                actual=h(target.read_bytes()) if target.exists() else None
                if actual not in (hashes['old'],hashes['new']):
                    raise SystemExit('Branch conflict; no files installed: '+name)
            for name in manifest:
                target=p/name
                target.parent.mkdir(parents=True,exist_ok=True)
                target.write_bytes(z.read(name))
        print('Verified and installed',len(manifest),'files')
        PYINSTALL
    - name: Check changed JavaScript syntax
      run: |-
        node --check cutloopz-job-control.js
        node --check test-cutloopz-runtime-readiness.js
        node --check test-cutloopz-offline-integration.js
        node --check cinematic-editing-engine.js
        node --check cutloopz-60s-route.js
        node --check test-cutloopz-provider-execution.js
        node --check test-cutloopz-provider-readiness.js
