# CutLoopz full-source Studio upgrade. Readable HTML, CSS and JavaScript; no Base64.
name: CutLoopz - Clean Studio & Readability Complete Replacements
'on':
  push:
    branches:
    - cutloopz-production-test
    paths:
    - .github/workflows/cutloopz-ui-olive-sage-readability.yml
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Check out production-test branch
      uses: actions/checkout@v4
      with:
        ref: cutloopz-production-test
        persist-credentials: true
    - name: Safeguard latest Studio files before replacing
      shell: bash
      run: |-
        python3 - <<'PYCHECK'
        from pathlib import Path
        import hashlib
        checks = {'public/customer.html': ('f5376dbec2f4b8c963fe21aa84072080ca149be1fab1e7abcb0bdc9e6c1770ac', 'ce5fafa892f9e4c80766a10cd39f6bdb534aff1d37514907d7ef7a2cb7315ea8'), 'public/my-studio.html': ('e64b634b4c4e259b7ed51285442217d9f5168a7d2674e08cfda375c4d0a242f9', 'c809ec5d31753b5566af745743f106eb3b03063651ed706f521eb3b0a5d3d402'), 'public/my-studio.css': ('1cc7d048f7b03bae6b80f2db66dc9bf1d07b644022ac377bf59b3ed6cb432d00', 'cba614b2b680ef68424721a924d87936c0d4ca3934f84ce3bbe8c8759f7ef0c7'), 'public/my-studio.js': ('6076484dc10d730963ded07346c7c4e29fe319496d63f999d178bcc20e77c8d7', '102b6b73dba86b8a23f7b90f45833c6d653ed1f13ba9295f7b408678b0510fc8')}
        for p, (expected, updated) in checks.items():
            path = Path(p)
            if not path.exists():
                raise SystemExit(f'ABORT: expected file missing: {p}')
            current = hashlib.sha256(path.read_bytes()).hexdigest()
            if current not in (expected, updated):
                raise SystemExit(f'ABORT: {p} has newer edits. No files were overwritten. Rebase the update before retrying.')
        print('Source verification passed. Safe to apply the complete replacement files.')
        PYCHECK
    - name: Install complete readable HTML, CSS and JavaScript
      shell: bash
      run: |-
        cat > public/customer.html <<'CUTLOOPZ_UI_COMPLETE_0_END'
