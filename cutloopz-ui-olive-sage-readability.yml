        const $=id=>document.getElementById(id);
        const floatingHeader=$('floatingHeader'),hero=$('hero'),backTop=$('backTop');
        let headerVisible=false;
        function closeProfileMenus(){document.querySelectorAll('[data-profile]').forEach(p=>{p.querySelector('[data-profile-menu]').hidden=true;p.querySelector('[data-profile-trigger]').setAttribute('aria-expanded','false')})}
        function updateHeader(){const y=hero.getBoundingClientRect().bottom;const shouldShow=headerVisible?y<145:y<105;if(shouldShow!==headerVisible){headerVisible=shouldShow;floatingHeader.classList.toggle('show',shouldShow);floatingHeader.setAttribute('aria-hidden',String(!shouldShow));floatingHeader.inert=!shouldShow;if(!shouldShow)closeProfileMenus()}backTop.hidden=window.scrollY<350}
        window.addEventListener('scroll',updateHeader,{passive:true});window.addEventListener('resize',updateHeader);updateHeader();backTop.addEventListener('click',()=>window.scrollTo({top:0,behavior:window.matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'}));
        function showGuest(){closeProfileMenus();document.querySelectorAll('[data-guest-actions]').forEach(x=>x.hidden=false);document.querySelectorAll('[data-profile]').forEach(x=>x.hidden=true)}
        function showCustomer(user){const name=String(user.name||user.firstName||user.email||'Customer').trim(),initial=Array.from(name)[0]?.toUpperCase()||'C';document.querySelectorAll('[data-guest-actions]').forEach(x=>x.hidden=true);document.querySelectorAll('[data-profile]').forEach(p=>{p.hidden=false;p.querySelector('[data-profile-initial]').textContent=initial;p.querySelector('[data-profile-name]').textContent=name})}
        async function loadCustomer(){try{const r=await fetch('/api/customer-auth/me',{credentials:'same-origin',cache:'no-store'});if(!r.ok){showGuest();return}const data=await r.json(),customer=data.customer||data.user;if(data.ok&&customer)showCustomer(customer);else showGuest()}catch{showGuest()}}
        document.querySelectorAll('[data-profile]').forEach(p=>{const trigger=p.querySelector('[data-profile-trigger]'),menu=p.querySelector('[data-profile-menu]'),signOut=p.querySelector('[data-sign-out]'),err=p.querySelector('[data-profile-error]');trigger.addEventListener('click',event=>{event.stopPropagation();const opening=menu.hidden;closeProfileMenus();menu.hidden=!opening;trigger.setAttribute('aria-expanded',String(opening));err.hidden=true});menu.addEventListener('click',event=>event.stopPropagation());signOut.addEventListener('click',async()=>{signOut.disabled=true;err.hidden=true;try{const r=await fetch('/api/customer-auth/logout',{method:'POST',credentials:'same-origin',cache:'no-store'});const d=await r.json();if(!r.ok||!d.ok)throw Error('Sign out failed');showGuest()}catch{err.textContent='Could not sign out. Please try again.';err.hidden=false}finally{signOut.disabled=false}})});document.addEventListener('click',event=>{if(!event.target.closest('[data-profile]'))closeProfileMenus()});document.addEventListener('keydown',event=>{if(event.key==='Escape')closeProfileMenus()});window.addEventListener('pageshow',loadCustomer);loadCustomer();
        </script>
        <script defer="" src="/cutloopz-home-upgrade.js"></script>

        <script id="cutloopz-hero-video-controls">
        (()=>{
        'use strict';
        const video=document.getElementById('cutloopzHeroVideo');
        const button=document.getElementById('cutloopzHeroPlayback');
        if(!video||!button)return;
        const reduced=window.matchMedia('(prefers-reduced-motion: reduce)');
        function sync(){
         const paused=video.paused;
         button.textContent=paused?'▶ Play':'❚❚ Pause';
         button.setAttribute('aria-label',paused?'Play showcase video':'Pause showcase video');
         button.setAttribute('aria-pressed',String(!paused));
        }
        button.addEventListener('click',()=>{if(video.paused)video.play().catch(sync);else video.pause();sync()});
        video.addEventListener('pause',sync);video.addEventListener('play',sync);
        video.addEventListener('error',()=>{video.style.display='none';button.hidden=true;video.parentNode.style.backgroundImage='url(/cutloopz-showcase-poster.jpg)';video.parentNode.style.backgroundPosition='center';video.parentNode.style.backgroundSize='cover'});
        if(reduced.matches){video.removeAttribute('autoplay');video.pause()}
        else video.play().catch(()=>{video.pause();sync()});
        sync();
        })();
        </script>
        </body>
        </html>
