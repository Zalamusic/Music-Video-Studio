        </head>
        <body>
        <a class="skip-link" href="#studioWorkspace">Skip to Studio</a>
        <header class="site-header">
         <a class="brand" href="/customer.html" aria-label="CutLoopz Media home"><img src="/a_sleek_cinematic_logo_on_a_black_background_a_g.png" alt=""><span><strong>CutLoopz Media</strong><small>A Director That Listens. A Video That Performs.</small></span></a>
         <nav class="topnav" aria-label="Studio navigation"><a class="active" href="/my-studio.html">My Studio</a><a href="/account.html?view=studio">My Videos & Account</a><a href="/glamour.html">Glamour Membership</a><a href="/customer.html">Home</a></nav>
        </header>
        <main class="shell" id="studioWorkspace">
         <div class="intro"><div><span class="eyebrow">YOUR MUSIC · YOUR VISION · YOUR VIDEO</span><h1>My Studio</h1><p>One step at a time. Your creative work stays with your project.</p></div><div class="status-wrap"><span id="signInStatus" class="status-chip">Checking account…</span><span id="saveStatus" class="save-message" role="status">Loading draft…</span></div></div>
         <div class="studio-frame">
          <div class="step-header"><div><span class="eyebrow" id="stepTag">PAGE 01 / 05</span><h2 id="stepTitle">Your Song &amp; Artist</h2><p id="stepSubtitle">Bring your music into the Studio.</p></div><button type="button" id="newProject" class="subtle">New Project</button></div>
          <div class="progress" role="progressbar" aria-label="Project progress" aria-valuemin="1" aria-valuemax="5" aria-valuenow="1" id="stepProgress"><span id="progressFill"></span></div>
          <div class="workspace-content">
           <section class="wizard-step" data-step="0" aria-labelledby="songHeading">
            <h3 id="songHeading">01 · Song details</h3>
            <div class="fields"><div class="field"><label for="title">Song title</label><input id="title" maxlength="120" placeholder="Enter your song title" autocomplete="off"></div><div class="field"><label for="duration">Video duration</label><select id="duration"><option value="15">15 seconds</option><option value="30" selected>30 seconds</option><option value="60">1 minute</option><option value="120">2 minutes</option><option value="180">3 minutes</option><option value="240">4 minutes</option><option value="300">5 minutes</option><option value="360">6 minutes</option><option value="custom">Custom (15 sec–6 min)</option></select><div id="customTimeField" hidden><label for="customTime">Exact duration (M:SS)</label><input id="customTime" inputmode="numeric" maxlength="4" placeholder="3:46"><p class="hint">For example 3:46 or 4:01. Maximum 6:00.</p></div></div></div>
            <div class="field source-mode-field">
              <label id="musicSourceLabel">Choose your music source</label>
              <div class="source-mode" role="group" aria-labelledby="musicSourceLabel">
                <button type="button" class="source-mode-btn selected" id="sourceUploadBtn" aria-pressed="true">Upload MP3 / WAV</button>
                <button type="button" class="source-mode-btn" id="sourceLinkBtn" aria-pressed="false">Paste Song Link</button>
              </div>
              <p class="hint source-choice-hint" id="sourceChoiceHint">Choose one method. You can switch later without losing your lyrics or creative direction.</p>
            </div>
            <div class="song-link-panel" id="songLinkPanel" aria-labelledby="songLinkHeading" hidden>
              <div class="song-link-heading"><span class="song-link-glyph" aria-hidden="true">↗</span><div><label id="songLinkHeading" for="songLink">Paste Song Link</label><p class="hint"><strong class="studio-platform studio-suno">SUNO</strong> · <strong class="studio-platform">Udio</strong> · <strong class="studio-platform">YouTube</strong> · <strong class="studio-platform">Spotify</strong> · <strong class="studio-platform">SoundCloud</strong></p></div></div>
              <div class="song-link-input-row"><input id="songLink" type="url" maxlength="2048" inputmode="url" placeholder="https://suno.com/song/…" autocomplete="off" spellcheck="false"><button type="button" class="gold" id="useSongLink">Use Link</button></div>
              <p id="songLinkStatus" class="operation-status" role="status">Paste a public song link to attach its source to your project.</p>
              <a id="openSongLink" href="#" rel="noopener noreferrer" target="_blank" hidden>Open original song ↗</a>
              <p class="hint">A song link takes you directly to the Listening Director when no audio file is selected. Add lyrics below for emotional direction. To analyze beats or generate with the actual audio, switch to MP3/WAV upload instead. CutLoopz does not rip or download audio or lyrics from streaming platforms.</p>
            </div>
            <div class="field" id="audioSourcePanel"><label for="songAudio">Upload MP3 or WAV <span class="optional">(optional for planning)</span></label><input id="songAudio" type="file" accept=".mp3,.wav,audio/mpeg,audio/wav"><p class="hint" id="audioLabel" role="status">Choose an MP3 or WAV (max 25 MB). Your browser will retain the selection privately for analysis on Page 2.</p></div>
            <div class="photo-upload-panel"><div class="photo-panel-heading"><span class="photo-panel-icon" aria-hidden="true">▧</span><div><label for="artistPhoto">Artist Photo <span class="optional">(optional for planning)</span></label><p class="hint">Add the artist's main reference photo here. Glamour Shots and additional looks remain separate membership features.</p></div></div><input id="artistPhoto" type="file" accept="image/jpeg,image/png,image/webp"><p class="hint" id="photoLabel" role="status">JPG, PNG or WebP · Max 12 MB · Saved privately in this browser for your current project.</p><div class="photo-preview" id="photoPreviewWrap" hidden><img id="photoPreview" alt="Preview of the selected artist reference photo"></div></div>
            <div class="field"><label for="lyrics">Lyrics <span class="optional">(recommended for emotional direction)</span></label><textarea id="lyrics" rows="9" maxlength="12000" placeholder="Paste the lyrics here. Add [00:15] timestamps if you have them."></textarea></div>
            <p class="helper">Your song and photo stay in this browser's private storage until you start a New Project or clear this site's data. They are not synced to other devices. You can also create a free Director storyboard using lyrics alone.</p>
           </section>
           <section class="wizard-step" data-step="1" aria-labelledby="analyzeHeading" hidden>
            <h3 id="analyzeHeading">02 · Free Song Analyzer</h3><p class="helper">Analyze musical rhythm and energy; no administrator password, payment, or GPU needed.</p>
            <div class="analysis-box"><p id="analysisIntro" role="status">Your selected song from Page 1 will be used automatically. You do not need to upload it again.</p><button type="button" id="analyzeBtn" class="gold" aria-label="Evaluate song rhythm and energy">Evaluate Song</button><p id="analyzeStatus" role="status" class="operation-status"></p>
             <div id="analysisResult" hidden><div class="metric-grid"><div><small>Estimated tempo</small><strong id="bpmValue">—</strong></div><div><small>Audio length</small><strong id="audioDurationValue">—</strong></div><div><small>Energy segments</small><strong id="energyValue">—</strong></div></div><p class="hint" id="analysisCaveat"></p></div>
            </div><p class="helper" id="analysisHelp">Audio analysis is optional. If you are working from a song link or lyrics only, continue to the Listening Director.</p>
           </section>
           <section class="wizard-step" data-step="2" aria-labelledby="directorHeading" hidden>
            <h3 id="directorHeading">03 · Listening Director</h3><p id="directorSourceNotice" class="studio-link-note" role="status" hidden></p><p class="helper">Your Director interprets the lyrics, overall mood, style, and any analyzed audio. You can edit everything before generating a storyboard.</p>
            <div class="fields"><div class="field"><label for="visualStyle">Cinematic style</label><select id="visualStyle"><option>Cinematic Realism</option><option>Romantic Drama</option><option>Urban Music Video</option><option>Hollywood Action</option><option>Science Fiction</option><option>Fantasy</option><option>3D Animation</option><option>Anime</option><option>Music Performance</option></select></div><div class="field"><label for="format">Video format</label><select id="format"><option value="vertical">9:16 Vertical</option><option value="landscape">16:9 Widescreen</option></select></div></div>
            <div class="fields"><div class="field"><label for="sceneSeconds">Length per scene</label><select id="sceneSeconds"><option value="10">10 seconds</option><option value="15" selected>15 seconds</option><option value="20">20 seconds</option><option value="30">30 seconds</option></select></div></div><p class="hint">Your artist reference photo is selected on Page 1. Tap Back to change it.</p>
            <div class="field"><label for="direction">Your creative direction</label><textarea id="direction" maxlength="4000" rows="11" placeholder="Describe the mood, location, action, performance, wardrobe, movement, and story. For example: confident performance in a city at night with smooth, natural movements."></textarea></div>
            <div class="field"><label for="characterNotes">Artist appearance and continuity</label><textarea id="characterNotes" maxlength="1000" rows="2" placeholder="Optional: hairstyle, distinctive outfits, expression, visual continuity..."></textarea></div>
            <button type="button" id="directorBtn" class="gold">Get Director Input · Create Storyboard</button><p id="directorStatus" class="operation-status" role="status"></p>
           </section>
           <section class="wizard-step" data-step="3" aria-labelledby="storyHeading" hidden>
            <h3 id="storyHeading">04 · Your Storyboard</h3><p class="helper">Each scene is numbered. Edit instructions or move between scene pairs without losing your changes.</p>
            <div id="storyEmpty" class="empty-state">No storyboard yet. Return to Page 3 and select <strong>Get Director Input · Create Storyboard</strong>.</div>
            <div id="storyContent" hidden><div class="story-head"><div><strong id="scenePairLabel">Scenes 1–2</strong><span id="storyEmotion"></span></div><div class="scene-nav"><button type="button" id="scenePrev" class="subtle">← Scenes</button><button type="button" id="sceneNext" class="subtle">Next scenes →</button></div></div><div id="sceneCards" class="scene-grid"></div><p class="helper">Changing scenes updates your draft only; it does not start video generation.</p></div>
           </section>
           <section class="wizard-step" data-step="4" aria-labelledby="reviewHeading" hidden>
            <h3 id="reviewHeading">05 · Review Your Vision</h3><p class="helper">Make sure the creative choices are right before your future video-production order.</p><div class="studio-no-credits"><strong>NO CREDITS. JUST VIDEO.</strong><p>When ordering opens, the price, included deliverables, and revision terms will be clear before checkout. No credit packs or token counting.</p></div>
            <div id="reviewSummary" class="review-grid"></div><div class="review-actions"><button type="button" id="editSong" class="subtle">Edit Song</button><button type="button" id="editDirector" class="subtle">Edit Director</button><button type="button" id="editStoryboard" class="subtle">Edit Scenes</button></div>
            <div class="blocked"><strong>Video generation is not available in this preview.</strong><p>Free analysis, Director planning, editing, and drafts are active. No video will be submitted or charged. We will enable production only after the independent GPU pipeline is proven.</p><button type="button" disabled aria-disabled="true">Generate Video — Not Enabled</button></div>
           </section>
          </div>
          <footer class="step-footer"><button type="button" id="backBtn" class="subtle" disabled>← Back</button><span id="stepCounter">Page 1 of 5</span><button type="button" id="nextBtn" class="gold">Next →</button></footer>
         </div>
         <section class="below-studio" aria-label="Other Studio tools"><a class="tool-card" href="/account.html?view=studio"><span aria-hidden="true">▣</span><strong>My Videos & Account</strong><small>Track saved orders and loyalty rewards.</small></a><a class="tool-card" href="/glamour.html"><span aria-hidden="true">✦</span><strong>Glamour Membership</strong><small>Optional subscriber-only wardrobe and photo features.</small></a></section>
         <p class="legal">Draft text saves on this device, and signed-in text drafts can sync to your account. Uploaded song and artist photo are kept privately in this browser (not on your account); changing devices may require reselecting them. Clear this project with New Project.</p>
