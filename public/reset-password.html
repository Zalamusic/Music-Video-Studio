
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#101014">

  <title>Reset Password | Cut Loopz Media</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(
        145deg,
        #09090c,
        #1c1920,
        #09090c
      );
      color: #fff;
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    .card {
      width: 100%;
      max-width: 430px;
      background: #17171c;
      border: 1px solid #725a30;
      border-radius: 20px;
      padding: 32px 24px;
      box-shadow: 0 12px 45px rgba(0,0,0,.45);
    }

    .brand {
      text-align: center;
      color: #d8b46b;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    .tagline {
      text-align: center;
      color: #bcb7ad;
      font-size: 13px;
      margin-bottom: 30px;
    }

    h1 {
      font-size: 23px;
      margin: 0 0 10px;
      text-align: center;
    }

    .description {
      text-align: center;
      color: #bcbcbc;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: bold;
    }

    input {
      display: block;
      width: 100%;
      padding: 14px;
      border: 1px solid #555;
      border-radius: 10px;
      background: #24242a;
      color: white;
      font-size: 16px;
      margin-bottom: 18px;
    }

    input:focus {
      outline: 2px solid #d8b46b;
      border-color: transparent;
    }

    button {
      width: 100%;
      padding: 15px;
      border: 0;
      border-radius: 10px;
      background: linear-gradient(
        135deg,
        #d8b46b,
        #a77a32
      );
      color: #111;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    .message {
      margin-top: 18px;
      padding: 12px;
      border-radius: 9px;
      text-align: center;
      line-height: 1.5;
      display: none;
      font-size: 14px;
    }

    .error {
      display: block;
      background: #401e24;
      color: #ffb7be;
    }

    .success {
      display: block;
      background: #193a2a;
      color: #a9efc1;
    }

    .back {
      display: block;
      margin-top: 25px;
      text-align: center;
      color: #d8b46b;
      text-decoration: none;
      font-size: 14px;
    }

    .hint {
      color: #aaa;
      font-size: 12px;
      margin: -9px 0 20px;
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="brand">CUT LOOPZ MEDIA</div>

    <div class="tagline">
      Your Music. Your Vision. Your Video.
    </div>

    <h1>Create a New Password</h1>

    <p class="description">
      Enter a new password to regain access
      to your Cut Loopz Media account.
    </p>

    <form id="resetForm">
      <label for="password">
        New Password
      </label>

      <input
        type="password"
        id="password"
        minlength="12"
        maxlength="128"
        autocomplete="new-password"
        required
      >

      <p class="hint">
        Use at least 12 characters.
      </p>

      <label for="confirmPassword">
        Confirm New Password
      </label>

      <input
        type="password"
        id="confirmPassword"
        minlength="12"
        maxlength="128"
        autocomplete="new-password"
        required
      >

      <button id="submitButton" type="submit">
        Reset My Password
      </button>
    </form>

    <div
      id="message"
      class="message"
      role="status"
      aria-live="polite"
    ></div>

    <a class="back" href="/account.html">
      Back to Sign In
    </a>
  </main>

  <script>
    const form = document.getElementById('resetForm');
    const passwordInput =
      document.getElementById('password');
    const confirmInput =
      document.getElementById('confirmPassword');
    const submitButton =
      document.getElementById('submitButton');
    const message =
      document.getElementById('message');

    const params = new URLSearchParams(
      window.location.search
    );

    const token = params.get('token');

    // Remove the token from the visible address bar.
    window.history.replaceState(
      null,
      '',
      window.location.pathname
    );

    function showMessage(text, type) {
      message.textContent = text;
      message.className = 'message ' + type;
    }

    if (!token || !/^[0-9a-f]{64}$/i.test(token)) {
      form.hidden = true;

      showMessage(
        'This password reset link is invalid. ' +
        'Please request a new link.',
        'error'
      );
    }

    form.addEventListener('submit', async event => {
      event.preventDefault();

      const password = passwordInput.value;
      const confirmation = confirmInput.value;

      if (password.length < 12) {
        showMessage(
          'Your password must contain at least 12 characters.',
          'error'
        );
        return;
      }

      if (password !== confirmation) {
        showMessage(
          'Your passwords do not match.',
          'error'
        );
        return;
      }

      submitButton.disabled = true;
      submitButton.textContent = 'Updating Password...';

      try {
        const response = await fetch(
          '/api/customer-auth/reset-password',
          {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              token,
              password
            })
          }
        );

        const data = await response.json();

        if (!response.ok || !data.ok) {
          throw new Error(
            data.error || 'Password reset failed.'
          );
        }

        form.hidden = true;

        showMessage(
          'Your password has been updated successfully. ' +
          'You can now sign in.',
          'success'
        );
      } catch (error) {
        showMessage(
          error.message ||
          'Unable to reset your password.',
          'error'
        );
      } finally {
        submitButton.disabled = false;
        submitButton.textContent = 'Reset My Password';
      }
    });
  </script>
</body>
</html>
