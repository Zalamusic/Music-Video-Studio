
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#101014">

  <title>Reset Password | CutLoopz Media</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(
        145deg,
        #09090c,
        #1c1920,
        #09090c
      );
      color: #fff;
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    .card {
      width: 100%;
      max-width: 430px;
      background: #17171c;
      border: 1px solid #725a30;
      border-radius: 20px;
      padding: 32px 24px;
      box-shadow: 0 12px 45px rgba(0,0,0,.45);
    }

    .brand {
      text-align: center;
      color: #d8b46b;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    .tagline {
      text-align: center;
      color: #bcb7ad;
      font-size: 13px;
      margin-bottom: 30px;
    }

    h1 {
      font-size: 23px;
      margin: 0 0 10px;
      text-align: center;
    }

    .description {
      text-align: center;
      color: #bcbcbc;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: bold;
    }

    input {
      display: block;
      width: 100%;
      padding: 14px;
      border: 1px solid #555;
      border-radius: 10px;
      background: #24242a;
      color: white;
      font-size: 16px;
    }

    input:focus {
      outline: 2px solid #d8b46b;
      border-color: transparent;
    }

    .password-field {
      position: relative;
      margin-bottom: 18px;
    }

    .password-field input {
      padding-right: 58px;
      margin-bottom: 0;
    }

    .toggle-password {
      position: absolute;
      right: 5px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      padding: 0;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: #d8b46b;
      cursor: pointer;
    }

    .toggle-password:hover {
      background: rgba(216,180,107,.12);
    }

    .toggle-password:focus-visible {
      outline: 2px solid #d8b46b;
      outline-offset: 1px;
    }

    .toggle-password svg {
      width: 23px;
      height: 23px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .toggle-password .eye-off {
      display: none;
    }

    .toggle-password[aria-pressed="true"] .eye-on {
      display: none;
    }

    .toggle-password[aria-pressed="true"] .eye-off {
      display: block;
    }

    .submit-button {
      width: 100%;
      padding: 15px;
      border: 0;
      border-radius: 10px;
      background: linear-gradient(
        135deg,
        #d8b46b,
        #a77a32
      );
      color: #111;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .submit-button:disabled {
      opacity: .6;
      cursor: wait;
    }

    .message {
      margin-top: 18px;
      padding: 12px;
      border-radius: 9px;
      text-align: center;
      line-height: 1.5;
      display: none;
      font-size: 14px;
    }

    .error {
      display: block;
      background: #401e24;
      color: #ffb7be;
    }

    .success {
      display: block;
      background: #193a2a;
      color: #a9efc1;
    }

    .back {
      display: block;
      margin-top: 25px;
      text-align: center;
      color: #d8b46b;
      text-decoration: none;
      font-size: 14px;
    }

    .hint {
      color: #aaa;
      font-size: 12px;
      margin: -9px 0 20px;
    }
  </style>
<script src="/cutloopz-floating-home.js" defer></script>
</head>

<body>
  <main class="card">
    <div class="brand">CUT LOOPZ MEDIA</div>

    <div class="tagline">
      Your Music. Your Vision. Your Video.
    </div>

    <h1>Create a New Password</h1>

    <p class="description">
      Enter a new password to regain access
      to your CutLoopz Media account.
    </p>

    <form id="resetForm">
      <label for="password">
        New Password
      </label>

      <div class="password-field">
        <input
          type="password"
          id="password"
          minlength="12"
          maxlength="128"
          autocomplete="new-password"
          required
        >

        <button
          type="button"
          class="toggle-password"
          data-target="password"
          aria-label="Show new password"
          aria-pressed="false"
          title="Show or hide password"
        >
          <svg
            class="eye-on"
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <path
              d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"
            />
            <circle cx="12" cy="12" r="3"/>
          </svg>

          <svg
            class="eye-off"
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <path
              d="M3 3l18 18"
            />
            <path
              d="M10.6 5.1A11 11 0 0 1 12 5c6.5 0 10 7 10 7a16 16 0 0 1-3.2 4.1"
            />
            <path
              d="M6.1 6.1C3.4 8 2 12 2 12s3.5 7 10 7c1.6 0 3-.4 4.2-1"
            />
            <path
              d="M10 10a3 3 0 0 0 4 4"
            />
          </svg>
        </button>
      </div>

      <p class="hint">
        Use at least 12 characters.
      </p>

      <label for="confirmPassword">
        Confirm New Password
      </label>

      <div class="password-field">
        <input
          type="password"
          id="confirmPassword"
          minlength="12"
          maxlength="128"
          autocomplete="new-password"
          required
        >

        <button
          type="button"
          class="toggle-password"
          data-target="confirmPassword"
          aria-label="Show confirmation password"
          aria-pressed="false"
          title="Show or hide password"
        >
          <svg
            class="eye-on"
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <path
              d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"
            />
            <circle cx="12" cy="12" r="3"/>
          </svg>

          <svg
            class="eye-off"
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <path d="M3 3l18 18"/>
            <path
              d="M10.6 5.1A11 11 0 0 1 12 5c6.5 0 10 7 10 7a16 16 0 0 1-3.2 4.1"
            />
            <path
              d="M6.1 6.1C3.4 8 2 12 2 12s3.5 7 10 7c1.6 0 3-.4 4.2-1"
            />
            <path
              d="M10 10a3 3 0 0 0 4 4"
            />
          </svg>
        </button>
      </div>

      <button
        id="submitButton"
        class="submit-button"
        type="submit"
      >
        Reset My Password
      </button>
    </form>

    <div
      id="message"
      class="message"
      role="status"
      aria-live="polite"
    ></div>

    <a class="back" href="/account.html">
      Back to Sign In
    </a>
  </main>

  <script>
    const form = document.getElementById('resetForm');
    const passwordInput =
      document.getElementById('password');
    const confirmInput =
      document.getElementById('confirmPassword');
    const submitButton =
      document.getElementById('submitButton');
    const message =
      document.getElementById('message');

    // Show or hide each password independently.
    document.querySelectorAll(
      '.toggle-password'
    ).forEach(button => {
      button.addEventListener('click', () => {
        const input = document.getElementById(
          button.dataset.target
        );

        if (!input) return;

        const show = input.type === 'password';

        input.type = show ? 'text' : 'password';

        button.setAttribute(
          'aria-pressed',
          String(show)
        );

        button.setAttribute(
          'aria-label',
          (show ? 'Hide ' : 'Show ') +
          (input.id === 'password'
            ? 'new password'
            : 'confirmation password')
        );
      });
    });

    const params = new URLSearchParams(
      window.location.search
    );

    const token = params.get('token');

    // Remove the token from the visible address bar.
    window.history.replaceState(
      null,
      '',
      window.location.pathname
    );

    function showMessage(text, type) {
      message.textContent = text;
      message.className = 'message ' + type;
    }

    if (!token || !/^[0-9a-f]{64}$/i.test(token)) {
      form.hidden = true;

      showMessage(
        'This password reset link is invalid. ' +
        'Please request a new link.',
        'error'
      );
    }

    form.addEventListener('submit', async event => {
      event.preventDefault();

      const password = passwordInput.value;
      const confirmation = confirmInput.value;

      if (password.length < 12) {
        showMessage(
          'Your password must contain at least 12 characters.',
          'error'
        );
        return;
      }

      if (password !== confirmation) {
        showMessage(
          'Your passwords do not match.',
          'error'
        );
        return;
      }

      submitButton.disabled = true;
      submitButton.textContent = 'Updating Password...';

      try {
        const response = await fetch(
          '/api/customer-auth/reset-password',
          {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              token,
              password
            })
          }
        );

        const data = await response.json();

        if (!response.ok || !data.ok) {
          throw new Error(
            data.error || 'Password reset failed.'
          );
        }

        form.hidden = true;

        showMessage(
          'Your password has been updated successfully. ' +
          'You can now sign in.',
          'success'
        );
      } catch (error) {
        showMessage(
          error.message ||
          'Unable to reset your password.',
          'error'
        );
      } finally {
        submitButton.disabled = false;
        submitButton.textContent = 'Reset My Password';
      }
    });
  </script>
</body>
</html>
