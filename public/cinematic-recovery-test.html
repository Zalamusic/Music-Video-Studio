<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>CutLoopz Recovery Studio</title>
<style>
* { box-sizing: border-box; }
body {
  background: #090909;
  color: white;
  font: 18px Arial, sans-serif;
  margin: 0;
}
main {
  max-width: 680px;
  margin: auto;
  padding: 24px;
}
h1 { color: #e5c477; }
section {
  background: #171717;
  border: 1px solid #444;
  border-radius: 16px;
  padding: 20px;
  margin-bottom: 20px;
}
label {
  display: block;
  margin: 20px 0 10px;
}
input, textarea, button {
  width: 100%;
  padding: 15px;
  font: inherit;
  border-radius: 10px;
}
input, textarea {
  background: #242424;
  color: white;
  border: 1px solid #555;
}
textarea { min-height: 200px; }
button {
  background: #e5c477;
  color: #111;
  border: 0;
  font-weight: bold;
  margin-top: 16px;
}
button:disabled { opacity: .4; }
pre {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
video, progress { width: 100%; }
input[type=checkbox] {
  width: 24px;
  height: 24px;
}
</style>
</head>
<body>
<main>
<h1>CUTLOOPZ</h1>
<p>Cinematic Recovery Studio</p>

<section>
<h2>Administrator</h2>
<label for="key">Video Administrator Key</label>
<input id="key" type="password" autocomplete="off">
<button id="check">Check Engine</button>
<pre id="engine">Engine not checked.</pre>
</section>

<section>
<h2>Opening Shot Test</h2>
<p>7 seconds · 768P · Vertical</p>

<label for="photo">Artist Reference Photo</label>
<input id="photo" type="file" accept="image/png,image/jpeg,image/webp">

<label for="audio">Original Song</label>
<input id="audio" type="file" accept="audio/*,.mp3,.wav,.flac">

<label for="prompt">Scene Description</label>
<textarea id="prompt" maxlength="3000"></textarea>

<p>Estimated base cost: $0.35. Additional charges may apply.</p>

<label>
<input id="approve" type="checkbox">
I approve one paid seven-second test.
</label>

<button id="render" disabled>
Generate 7-Second Test
</button>

<p>Precision Director disabled. Full-minute rendering locked.</p>
</section>

<section>
<h2>Rendering Progress</h2>
<progress id="progress" max="1" value="0"></progress>
<pre id="status">Waiting for test.</pre>

<label for="job">Recovery Job ID</label>
<input id="job" type="text">

<button id="resume">Check Existing Job</button>

<video id="player" controls playsinline hidden></video>
<button id="download" hidden>Save Test Video</button>
</section>
</main>

<script>
'use strict';

const $ = id => document.getElementById(id);
const BASE = '/api/cinematic-recovery';

let ready = false;
let busy = false;
let polling = false;
let videoUrl = null;
let currentJob = null;

function headers() {
  const key = $('key').value.trim();
  if (!key) {
    throw Error('Enter administrator key.');
  }
  return {
    'X-Video-Admin-Key': key
  };
}

async function api(url, options = {}) {
  const response = await fetch(url, {
    ...options,
    headers: headers(),
    cache: 'no-store'
  });

  const data = await response.json();

  if (!response.ok) {
    throw Error(data.error || 'Request failed');
  }

  return data;
}

function update() {
  $('render').disabled =
    !ready ||
    busy ||
    polling ||
    !$('approve').checked;
}

function status(message) {
  $('status').textContent = message;
}

function resetVideo() {
  if (videoUrl) {
    URL.revokeObjectURL(videoUrl);
  }

  videoUrl = null;
  $('player').removeAttribute('src');
  $('player').load();
  $('player').hidden = true;
  $('download').hidden = true;
}

$('key').oninput = () => {
  ready = false;
  $('engine').textContent = 'Check engine again.';
  update();
};

$('approve').onchange = update;

$('check').onclick = async () => {
  ready = false;
  update();
  $('check').disabled = true;

  try {
    const data = await api(BASE + '/preflight');

    ready =
      data.version === 'recovery-v2' &&
      data.enabled === true &&
      data.precisionDirector === false &&
      data.openingTestSeconds === 7 &&
      !data.activeJob;

    $('engine').textContent =
      JSON.stringify(data, null, 2) +
      '\n\n' +
      (ready
        ? 'Ready for controlled test.'
        : 'Rendering disabled or unavailable.');

  } catch (error) {
    $('engine').textContent = error.message;
  } finally {
    $('check').disabled = false;
    update();
  }
};

async function loadVideo(id) {
  const response = await fetch(
    BASE + '/jobs/' + id + '/video',
    {
      headers: headers(),
      cache: 'no-store'
    }
  );

  if (!response.ok) {
    throw Error('Video retrieval failed.');
  }

  resetVideo();

  videoUrl = URL.createObjectURL(
    await response.blob()
  );

  $('player').src = videoUrl;
  $('player').hidden = false;
  $('download').hidden = false;
}

async function monitor(id) {
  if (polling) return;

  if (!/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(id)) {
    status('Invalid job ID.');
    return;
  }

  polling = true;
  currentJob = id;
  update();

  try {
    while (true) {
      const data = await api(
        BASE + '/jobs/' + id
      );

      $('progress').max =
        data.totalShots || 1;

      $('progress').value =
        data.finished || 0;

      status(JSON.stringify(data, null, 2));

      if (data.status === 'review_required') {
        await loadVideo(id);

        status(
          'Test completed. Review identity, realism, movement, anatomy and lip sync.'
        );

        break;
      }

      if (data.status === 'failed') {
        status(
          'Rendering failed.\n' +
          (data.error || 'Unknown error') +
          '\nNo automatic retry.'
        );

        break;
      }

      await new Promise(resolve =>
        setTimeout(resolve, 5000)
      );
    }

  } catch (error) {
    status(
      error.message +
      '\nCheck Existing Job. Do not submit another render.'
    );
  } finally {
    polling = false;
    ready = false;
    update();
  }
}

$('render').onclick = async () => {
  if (
    busy ||
    polling ||
    !ready ||
    !$('approve').checked
  ) return;

  const photo = $('photo').files[0];
  const audio = $('audio').files[0];
  const prompt = $('prompt').value.trim();

  if (!photo || !audio) {
    status('Select artist photo and song.');
    return;
  }

  if (prompt.length < 12) {
    status('Enter the opening scene description.');
    return;
  }

  if (!confirm('Approve one paid 7-second render?')) {
    return;
  }

  busy = true;
  ready = false;
  $('approve').checked = false;

  update();
  resetVideo();

  $('progress').value = 0;

  status('Submitting controlled test...');

  try {
    const form = new FormData();

    form.append('photo', photo);
    form.append('audio', audio);

    form.append(
      'confirm',
      'APPROVE_7_SECONDS_FAL_COST'
    );

    form.append(
      'shots',
      JSON.stringify([
        {
          duration: 7,
          prompt
        }
      ])
    );

    const job = await api(
      BASE + '/render',
      {
        method: 'POST',
        body: form
      }
    );

    $('job').value = job.id;
    currentJob = job.id;

    await monitor(job.id);

  } catch (error) {
    status(
      error.message +
      '\nNo automatic retry. Check for an active job.'
    );
  } finally {
    busy = false;
    update();
  }
};

$('resume').onclick = async () => {
  if (busy || polling) return;
  await monitor($('job').value.trim());
};

$('download').onclick = () => {
  if (!videoUrl) return;

  const link = document.createElement('a');

  link.href = videoUrl;
  link.download =
    'CutLoopz-Opening-' +
    currentJob +
    '.mp4';

  link.click();
};
</script>
</body>
</html>
