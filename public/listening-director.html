
<style>
/* Cut Loopz Media — Listening Director polish */
body {
  font-size:16px;
  line-height:1.6;
  -webkit-text-size-adjust:100%;
}
.brand {font-size:16px}
.sub {font-size:11px}
.header-link {font-size:14px}
.eyebrow {font-size:13px}
.hero p {font-size:16px;line-height:1.6}
.step-head p {font-size:15px}
.progress-labels {font-size:14px}
.small,.field-help {font-size:14px;line-height:1.6}
label {font-size:16px}
input,textarea,select,button {font-size:16px}
.note,.duration-message {font-size:15px}
.duration-divider {font-size:13px}
.duration-result span {font-size:14px}
.summary-item span {font-size:14px}
.summary-item strong {font-size:16px}
.scene-number,.scene-time {font-size:14px}
.scene p {font-size:16px;line-height:1.6}
.scene h3 {font-size:18px}
.scene summary {font-size:15px}
pre {font-size:13px}
footer {font-size:15px}

/* Compact, controlled lyrics field */
#lyrics {
  min-height:175px;
  height:175px;
  max-height:310px;
  overflow-y:auto;
  resize:vertical;
  line-height:1.65;
  transition:height .15s ease;
}
#concept {
  min-height:160px;
}
.panel {margin:12px 0}
.step-head {margin-bottom:10px}
.field-help {margin-top:6px}

@media(max-width:480px) {
  .brand {font-size:15px}
  .sub {font-size:10px}
  .header-link {font-size:14px}
  .panel {padding:16px}
  #lyrics {min-height:175px;max-height:290px}
}
@media(prefers-reduced-motion:reduce) {
  #lyrics {transition:none}
}
</style>

<script>
(function () {
  'use strict';

  const lyrics = document.getElementById('lyrics');
  if (!lyrics) return;

  const maxHeight = window.matchMedia('(max-width:480px)').matches
    ? 290 : 310;

  function fitLyrics() {
    lyrics.style.height = '175px';
    const desired = Math.min(
      maxHeight,
      Math.max(175, lyrics.scrollHeight + 2)
    );
    lyrics.style.height = desired + 'px';
    lyrics.style.overflowY =
      lyrics.scrollHeight > maxHeight ? 'auto' : 'hidden';
  }

  lyrics.addEventListener('input', fitLyrics);
  window.addEventListener('resize', fitLyrics);
  fitLyrics();

  // Preserve a backup of nonempty lyrics without
  // overwriting the existing storyboard draft.
  const backupKey = 'cutloopz-lyrics-backup-v1';
  try {
    if (!lyrics.value.trim()) {
      const backup = localStorage.getItem(backupKey);
      if (backup) {
        lyrics.value = backup;
        lyrics.dispatchEvent(new Event('input', {
          bubbles:true
        }));
      }
    }
  } catch {}

  lyrics.addEventListener('input', () => {
    try {
      if (lyrics.value.trim()) {
        localStorage.setItem(backupKey, lyrics.value);
      }
    } catch {}
  });
})();
</script>
