
name: CutLoopz FFmpeg Assembly Test

on:
  workflow_dispatch:

jobs:
  assembly-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout staging code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install FFmpeg and FFprobe
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version
          ffprobe -version

      - name: Install dependencies
        run: npm ci

      - name: Run real video assembly test
        env:
          ENABLE_PAID_GENERATION: 'false'
          CUTLOOPZ_PERFORMANCE_PILOT_ENABLED: 'false'
        run: node --test test-assembler-real-ffmpeg.mjs
