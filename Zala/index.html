
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zala Music Video Studio</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px 16px;
      background: #f0f2f5;
      color: #1c1e21;
      font-family: Arial, sans-serif;
    }

    main {
      max-width: 650px;
      margin: 30px auto;
      padding: 26px;
      background: #ffffff;
      border: 1px solid #dddfe2;
      border-radius: 18px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.07);
    }

    h1 {
      margin-bottom: 8px;
      font-size: 30px;
      color: #1877f2;
    }

    .sub {
      color: #65676b;
      line-height: 1.5;
    }

    label {
      display: block;
      margin: 20px 0 8px;
      font-weight: bold;
      color: #1c1e21;
    }

    input, textarea, select {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccd0d5;
      border-radius: 9px;
      background: #ffffff;
      color: #1c1e21;
      font-size: 16px;
      font-family: Arial, sans-serif;
    }

    input:focus, textarea:focus, select:focus {
      outline: none;
      border-color: #1877f2;
      box-shadow: 0 0 0 2px rgba(24, 119, 242, 0.15);
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    input[type="file"] {
      font-size: 14px;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 15px;
      border: 0;
      border-radius: 9px;
      background: #1877f2;
      color: #ffffff;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      background: #166fe5;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    #status {
      margin-top: 18px;
      line-height: 1.5;
      overflow-wrap: anywhere;
      color: #1c1e21;
    }

    video {
      width: 100%;
      margin-top: 18px;
      border-radius: 10px;
    }

    a {
      color: #1877f2;
    }

    .note {
      color: #65676b;
      font-size: 13px;
    }

    @media (max-width: 480px) {
      body {
        padding: 12px;
      }

      main {
        margin: 12px auto;
        padding: 20px;
      }

      h1 {
        font-size: 26px;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>Zala Music Video Studio</h1>
    <p class="sub">Turn your music into a cinematic music video.</p>

    <form id="videoForm">
      <label for="title">Song Title</label>
      <input id="title" name="title" type="text"
        maxlength="120" placeholder="Enter your song title">

      <label for="audio">Upload Your Song (MP3 or WAV)</label>
      <input id="audio" name="audio" type="file"
        accept=".mp3,.wav,audio/mpeg,audio/wav" required>
      <p class="note">Choose an audio file from your device.</p>

      <label for="prompt">Describe Your Music Video</label>
      <textarea id="prompt" name="prompt" required
        placeholder="Describe the scenes, characters, locations, mood, and visual style you want..."></textarea>

      <label for="format">Video Format</label>
      <select id="format" name="format">
        <option value="vertical">Vertical (TikTok, Reels, Shorts)</option>
        <option value="landscape">Landscape (YouTube)</option>
      </select>

      <button id="createButton" type="submit">
        Create Music Video
      </button>
    </form>

    <div id="status" role="status" aria-live="polite"></div>
    <div id="result"></div>
  </main>

  <script>
    const form = document.getElementById("videoForm");
    const button = document.getElementById("createButton");
    const statusBox = document.getElementById("status");
    const resultBox = document.getElementById("result");

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      button.disabled = true;
      statusBox.textContent = "Submitting your request...";
      resultBox.replaceChildren();

      try {
        const response = await fetch("/api/create", {
          method: "POST",
          body: new FormData(form)
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "The request failed.");
        }

        if (!data.url) {
          throw new Error("The server did not return a video URL.");
        }

        statusBox.textContent = "Your video is ready!";

        const video = document.createElement("video");
        video.src = data.url;
        video.controls = true;
        video.playsInline = true;
        resultBox.appendChild(video);

        const download = document.createElement("a");
        download.href = data.url;
        download.target = "_blank";
        download.rel = "noopener";
        download.textContent = "Open or download your video";
        download.style.display = "block";
        download.style.marginTop = "16px";
        resultBox.appendChild(download);

      } catch (error) {
        statusBox.textContent =
          "Unable to create video: " + error.message;
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
